<script>
var TEAMS=["Abesigamukama FC","Ruborogota United","Kashija FC","Kigwera Stars","Rwamucucu FC","Nyamiryango FC","Kitojo Lions","Butare FC","Kakindo FC","Kijubwe FC","Rwengiri FC","Kagarama FC","Mitooma FC","Kashenshero FC","Rukungiri FC","Katerampungu FC","Kyanamira FC","Nyakagyeme FC","Rugarama FC","Buhunga FC"];
var d=null; try{d=JSON.parse(localStorage.getItem('rpl_final'))}catch(e){d=null}
if(!d){ d={teams:TEAMS.slice(),coaches:{},players:[],fixtures:[],transfers:[],commentary:{}}; }
if(!d.teams) d.teams=TEAMS.slice(); if(!d.coaches) d.coaches={}; if(!d.players) d.players=[]; if(!d.fixtures) d.fixtures=[]; if(!d.transfers) d.transfers=[]; if(!d.commentary) d.commentary={};
var ADMIN_PASS="RPL2026"; var isAdmin=localStorage.getItem('rpl_admin')==='yes';
var liveTimer=null,liveSec=0,liveAdded=0,liveFixtureId=null;
function requireAdmin(){ if(!isAdmin){ alert('Admin only. Please login as Admin.'); return false; } return true; }
function save(){ localStorage.setItem('rpl_final',JSON.stringify(d)); renderAll(); }
function fmtTime(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),ss=s%60; if(m>=90&&liveAdded>0) return '90+'+(m-90)+':'+(ss<10?'0'+ss:ss); return (m<10?'0'+m:m)+':'+(ss<10?'0'+ss:ss); }
function goPage(p,btn){ ['home','table','fixtures','players','teams','transfers','live'].forEach(function(x){ var el=document.getElementById('tab-'+x); if(el) el.style.display=(x==p?'block':'none'); }); document.querySelectorAll('.navBtn').forEach(function(b){b.classList.remove('active')}); if(btn) btn.classList.add('active'); if(p=='fixtures') renderFixtures(); window.scrollTo(0,0); }
function getLogo(n){ var w=n.trim().split(' '),o=''; for(var i=0;i<w.length;i++){ if(w[i].length>0) o+=w[i].charAt(0); if(o.length>=2) break; } return o.toUpperCase(); }
function fmtDate(s){ try{ return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).toUpperCase(); }catch(e){ return s||''; } }
function fixF(f){ if(!f.stats) f.stats={possH:50,possA:50,shotsH:0,shotsA:0,shotsOnH:0,shotsOnA:0,cornersH:0,cornersA:0,foulsH:0,foulsA:0}; if(f.mom==null) f.mom=50; if(!f.status) f.status='UPCOMING'; if(!f.date){ var r=parseInt(f.round||1)||1; var b=new Date('2026-11-29T15:00:00'); b.setDate(b.getDate()+(r-1)*7); f.date=b.toISOString().slice(0,10); } if(!f.time) f.time='15:00'; if(!f.venue) f.venue='Ruborogota Stadium'; if(!f.round) f.round=f.week||1; if(!f.week) f.week=f.round; return f; }
d.fixtures.forEach(fixF);
function getTable(){ var m={},i; for(i=0;i<d.teams.length;i++) m[d.teams[i]]={team:d.teams[i],P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,PTS:0}; for(i=0;i<d.fixtures.length;i++){ var f=d.fixtures[i]; if(f.status!=='FT'||f.hs==null||f.as==null) continue; var hg=parseInt(f.hs),ag=parseInt(f.as); var h=m[f.home],a=m[f.away]; if(!h||!a) continue; h.P++;a.P++;h.GF+=hg;h.GA+=ag;a.GF+=ag;a.GA+=hg; if(hg>ag){h.W++;a.L++;h.PTS+=3}else if(hg<ag){a.W++;h.L++;a.PTS+=3}else{h.D++;a.D++;h.PTS++;a.PTS++;} } var arr=[]; for(var k in m) arr.push(m[k]); for(i=0;i<arr.length;i++) arr[i].GD=arr[i].GF-arr[i].GA; arr.sort(function(a,b){ if(b.PTS!==a.PTS) return b.PTS-a.PTS; if(b.GD!==a.GD) return b.GD-a.GD; return b.GF-a.GF; }); return arr; }
function getPts(p){ return (p.goals||0)*4+(p.assists||0)*3-(p.yellow||0)-(p.red||0)*3; }
function checkAdmin(){ var b=document.getElementById('adminBtn'); if(b) b.innerHTML=isAdmin?'ADMIN - LOGOUT':'ADMIN LOGIN'; var mb=document.getElementById('modeBadge'); if(mb) mb.innerHTML=isAdmin?'<span class="badge adminBadge">ADMIN MODE - Full Control</span>':'<span class="badge fanBadge">FAN MODE - View Only</span>'; document.body.setAttribute('data-admin',isAdmin?'true':'false'); }
function toggleAdmin(){ if(isAdmin){ isAdmin=false; localStorage.setItem('rpl_admin','no'); alert('Logged out - Fan view'); } else { var pw=prompt('Enter Admin Password:'); if(pw===ADMIN_PASS){ isAdmin=true; localStorage.setItem('rpl_admin','yes'); alert('Welcome Admin!'); } else { alert('Wrong password!'); return; } } save(); }
function resetEverything(){ if(!requireAdmin()) return; if(!confirm('RESET EVERYTHING? Scores go to 0. Teams & Players stay.')) return; d.fixtures.forEach(function(f){ f.status='UPCOMING'; f.hs=null; f.as=null; f.played=false; f.matchSeconds=0; f.mom=50; f.stats={possH:50,possA:50,shotsH:0,shotsA:0,shotsOnH:0,shotsOnA:0,cornersH:0,cornersA:0,foulsH:0,foulsA:0}; }); d.commentary={}; d.players.forEach(function(p){ p.goals=0; p.assists=0; }); clearInterval(liveTimer); liveSec=0; liveAdded=0; liveFixtureId=null; save(); alert('RESET DONE!'); }
function renderHome(){ var rows=getTable(); var top=rows.slice(0,4).map(function(r,i){ return (i+1)+'. '+r.team+' - '+r.PTS+' pts'; }).join('<br>'); document.getElementById('homeNews').innerHTML='<b>🏆 TOP 4</b><br>'+top; var lead=rows[0]?rows[0].team:'No teams yet'; document.getElementById('trophyZone').innerHTML='🏆 LEADER: <b>'+lead+'</b> | Total Fixtures: '+d.fixtures.length+' | Live: '+d.fixtures.filter(function(f){return f.status==='LIVE'}).length; document.getElementById('adminHome').innerHTML=isAdmin?'<button class="red" onclick="resetEverything()">RESET EVERYTHING</button>':''; }
function renderTable(){ var rows=getTable(); var html='<table><tr style="background:#37003c;color:white"><th>#</th><th>Team</th><th>Pl</th><th>W</th><th>D</th><th>L</th><th>GF-GA</th><th>GD</th><th>Pts</th></tr>'; for(var i=0;i<rows.length;i++){ var r=rows[i],pos=i+1,bar='#eee',row='#fff'; if(pos<=4){bar='#00ff85';row='#e6ffe6'} else if(pos==5){bar='#2563eb'} else if(pos>=18){bar='#dc2626';row='#fee2e2'} html+='<tr style="background:'+row+'"><td style="width:6px;padding:0;background:'+bar+'"></td><td><b>'+pos+'</b></td><td><b>'+r.team+'</b></td><td>'+r.P+'</td><td>'+r.W+'</td><td>'+r.D+'</td><td>'+r.L+'</td><td>'+r.GF+'-'+r.GA+'</td><td>'+r.GD+'</td><td><b>'+r.PTS+'</b></td></tr>'; } html+='</table><div style="font-size:12px;margin-top:10px">🟩 1-4 Champions League &nbsp; 🟦 5th Europa &nbsp; 🟥 18-20 Relegated</div>'; document.getElementById('leagueTable').innerHTML=html; }
function teamOptions(){ return d.teams.map(function(t){ return '<option>'+t+'</option>'; }).join(''); }
function addFixture(){ if(!requireAdmin()) return; var h=document.getElementById('fx-home').value,a=document.getElementById('fx-away').value; if(!h||!a||h===a){ alert('Select 2 different teams!'); return; } d.fixtures.push(fixF({id:Date.now()+Math.floor(Math.random()*1000),home:h,away:a,date:document.getElementById('fx-date').value||'2026-11-29',time:document.getElementById('fx-time').value||'15:00',round:parseInt(document.getElementById('fx-round').value)||1,venue:document.getElementById('fx-venue').value||'Ruborogota Stadium',hs:null,as:null,played:false,status:'UPCOMING',mom:50,matchSeconds:0})); save(); }
function editFixture(id){ if(!requireAdmin()) return; var f=d.fixtures.find(function(x){return x.id==id}); if(!f) return; var date=prompt('Date (YYYY-MM-DD):',f.date); if(date==null) return; var time=prompt('Time:',f.time); if(time==null) return; var venue=prompt('Stadium:',f.venue); if(venue==null) return; f.date=date; f.time=time; f.venue=venue; save(); }
function deleteFixture(id){ if(!requireAdmin()) return; if(!confirm('Delete this fixture?')) return; d.fixtures=d.fixtures.filter(function(x){return x.id!=id}); save(); }
function genAllFixtures(){ if(!requireAdmin()) return; if(d.fixtures.length>0 && !confirm('You have '+d.fixtures.length+' fixtures. Delete and generate fresh 380?')) return; d.fixtures=[]; var arr=d.teams.slice(),n=arr.length,rounds=[]; for(var r=0;r<n-1;r++){ var week=[]; for(var i=0;i<n/2;i++){ var h=arr[i],a=arr[n-1-i]; week.push(r%2===0?{home:h,away:a}:{home:a,away:h}); } rounds.push(week); var last=arr.pop(); arr.splice(1,0,last); } var weekNo=1,base=new Date('2026-11-29T15:00:00'); function push(list,rev){ list.forEach(function(w){ w.forEach(function(m,j){ var dt=new Date(base.getTime()+(weekNo-1)*7*24*60*60*1000); d.fixtures.push(fixF({id:Date.now()+weekNo*100+j+(rev?5000:0),week:weekNo,round:weekNo,home:rev?m.away:m.home,away:rev?m.home:m.away,hs:null,as:null,played:false,status:'UPCOMING',mom:50,matchSeconds:0,date:dt.toISOString().slice(0,10),time:'15:00',venue:'Ruborogota Stadium'})); }); weekNo++; }); } push(rounds,false); push(rounds,true); save(); alert('DONE! 380 Matches!'); }
function clearFixtures(){ if(!requireAdmin()) return; if(!confirm('Delete ALL fixtures?')) return; d.fixtures=[]; save(); }
function renderFixtures(){ var el=document.getElementById('fixtureList'); if(!el) return; document.getElementById('fixtureAdmin').innerHTML=isAdmin?'<div style="background:#f8f8f8;padding:12px;border-radius:12px"><b>+ Add Fixture</b><select id="fx-home">'+teamOptions()+'</select><select id="fx-away">'+teamOptions()+'</select><div style="display:flex;gap:6px"><input id="fx-round" type="number" value="1"><input id="fx-date" type="date" value="2026-11-29"><input id="fx-time" type="time" value="15:00"></div><input id="fx-venue" value="Ruborogota Stadium"><button class="green" style="width:100%" onclick="addFixture()">+ ADD FIXTURE</button><div style="display:flex;gap:6px"><button class="purple" style="flex:1" onclick="genAllFixtures()">GENERATE 380 MATCHES</button><button class="red" style="flex:1" onclick="clearFixtures()">DELETE ALL</button></div></div>':''; var sel=document.getElementById('filterWeek'); if(sel){ var cur=sel.value; var weeks=[]; d.fixtures.forEach(function(f){ if(weeks.indexOf(String(f.round))<0) weeks.push(String(f.round)); }); weeks.sort(function(a,b){return a-b}); sel.innerHTML='<option value="all">All Matchweeks</option>'+weeks.map(function(w){return '<option value="'+w+'">Matchweek '+w+'</option>'}).join(''); sel.value=cur||'all'; } var filter=sel?sel.value:'all'; var list=d.fixtures.slice(); if(filter!=='all') list=list.filter(function(f){return String(f.round)===filter}); document.getElementById('fixCount').innerHTML='Showing '+list.length+' of '+d.fixtures.length+' fixtures'; if(list.length===0){ el.innerHTML='<p style="text-align:center;color:#888">No fixtures yet - Admin: Generate 380 Matches</p>'; return; } list.sort(function(a,b){ return (a.date||'').localeCompare(b.date||'')||(a.round-b.round); }); var h='',last=''; list.forEach(function(f){ fixF(f); if(f.date!==last){ last=f.date; h+='<div class="fx-date">'+fmtDate(f.date)+' • MATCHWEEK '+f.round+'</div>'; } var score=(f.hs===null)?'VS':f.hs+' - '+f.as; var badge=f.status==='LIVE'?'<span style="background:#dc2626;color:#fff;padding:2px 8px;border-radius:10px">● LIVE '+fmtTime(f.matchSeconds||0)+'</span>':f.status==='FT'?'<span style="background:#111;color:#fff;padding:2px 8px;border-radius:10px">FT</span>':'<span style="background:#eab308;padding:2px 8px;border-radius:10px">UPCOMING</span>'; h+='<div class="fx-card" onclick="openMatch('+f.id+')"><div class="fx-top"><span>ROUND '+f.round+' • '+f.venue+'</span><span>'+badge+' • '+f.time+'</span></div><div class="fx-teams"><div class="fx-team"><div class="fx-logo">'+getLogo(f.home)+'</div>'+f.home+'</div><div class="fx-score">'+score+'</div><div class="fx-team r">'+f.away+'<div class="fx-logo">'+getLogo(f.away)+'</div></div></div><button style="width:100%;background:#00ff85" onclick="event.stopPropagation();openMatch('+f.id+')">▶️ View Match Centre →</button>'+(isAdmin?'<div style="display:flex;gap:8px;margin-top:8px"><button style="flex:1;background:#eee" onclick="event.stopPropagation();editFixture('+f.id+')">✏️ Edit</button><button style="flex:1;background:#fff;color:#e11d48;border:1px solid #fecdd3" onclick="event.stopPropagation();deleteFixture('+f.id+')">🗑️ Delete</button></div>':'')+'</div>'; }); el.innerHTML=h; }
function openMatch(id){ var f=d.fixtures.find(function(x){return x.id==id}); if(!f) return; fixF(f); var comments=(d.commentary[id]||[]); var comHtml=comments.map(function(c){return '<div style="padding:8px;border-bottom:1px solid #eee"><b>'+c.min+' min</b> - '+c.text+'</div>'}).join('')||'<p style="color:#888">No commentary yet</p>'; var s=f.stats; function bar(label,hv,av){ var tot=hv+av||1; var hp=(hv===0&&av===0)?50:Math.round(hv/tot*100); return '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><b>'+hv+'</b><span>'+label+'</span><b>'+av+'</b></div><div style="display:flex;height:10px;border-radius:5px;overflow:hidden;background:#eee"><div style="width:'+hp+'%;background:#1e40af"></div><div style="flex:1;background:#dc2626"></div></div></div>'; } var h='<button onclick="renderFixtures()" style="padding:8px 15px;background:#1e40af;color:#fff;border-radius:20px;width:auto">← Back</button>'; h+='<h2 style="text-align:center">'+f.home+' '+(f.hs===null?'vs':f.hs+' - '+f.as)+' '+f.away+'</h2>'; h+='<p style="text-align:center">Round '+f.round+' | '+f.date+' '+f.time+' | '+f.venue+' | '+f.status+' '+(f.status==='LIVE'?fmtTime(f.matchSeconds||0):'')+'</p>'; if(isAdmin){ h+='<div style="background:#fff;padding:12px;border-radius:12px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap"><input id="edit-hs" type="number" value="'+(f.hs===null?0:f.hs)+'" style="width:60px;margin:0;text-align:center"><b> - </b><input id="edit-as" type="number" value="'+(f.as===null?0:f.as)+'" style="width:60px;margin:0;text-align:center"><button onclick="updateScore('+f.id+')" class="green" style="width:auto">SAVE SCORE</button><button onclick="setStatus('+f.id+',\'LIVE\')" style="width:auto;background:#dc2626;color:#fff">LIVE</button><button onclick="setStatus('+f.id+',\'FT\')" style="width:auto;background:#111;color:#fff">FULL TIME</button><button onclick="addMinuteToFixture('+f.id+',1)" style="width:auto;background: ound:#fff;padding:12px;border-radius:12px"><b>🎙️ LIVE COMMENTARY</b><div style="display:flex;gap:6px;margin:8px 0"><input id="com-min" placeholder="Min" style="width:70px;margin:0"><input id="com-text" placeholder="What happened?" style="flex:1;margin:0"><button onclick="addComment('+f.id+')" class="green" style="width:auto">+ ADD</button></div><div>'+comHtml+'</div></div>'; h+='<div style="display:flex;gap:6px;margin-top:10px"><button style="flex:1;background:#eee" onclick="editFixture('+f.id+');openMatch('+f.id+')">✏️ EDIT DATE / TIME / STADIUM</button><button style="flex:1;background:#dc2626;color:#fff" onclick="deleteFixture('+f.id+')">🗑️ DELETE THIS FIXTURE</button></div>'; } else { h+='<div style="background:#fff;padding:16px;border-radius:12px;text-align:center"><b style="font-size:32px">'+(f.hs===null?'-':f.hs)+' - '+(f.as===null?'-':f.as)+'</b><br><span style="color:#888">'+f.status+'</span></div>'; h+='<div style="background:#fff;padding:12px;border-radius:12px;margin:10px 0"><b>⚡ MOMENTUM</b><div style="display:flex;height:18px;border-radius:9px;overflow:hidden;margin:8px 0"><div style="width:'+f.mom+'%;background:#1e40af"></div><div style="flex:1;background:#dc2626"></div></div><p style="text-align:center;font-size:12px;color:#666">'+f.mom+'% - '+(f.mom>60?f.home+' DOMINATING':f.mom<40?f.away+' DOMINATING':'BALANCED GAME')+'</p></div>'; h+='<div style="background:#fff;padding:12px;border-radius:12px;margin:10px 0"><b>📊 MATCH STATISTICS</b>'+bar('Possession %',s.possH,s.possA)+bar('Shots',s.shotsH,s.shotsA)+bar('Shots on Target',s.shotsOnH,s.shotsOnA)+bar('Corners',s.cornersH,s.cornersA)+bar('Fouls',s.foulsH,s.foulsA)+'</div>'; h+='<div style="background:#fff;padding:12px;border-radius:12px"><b>🎙️ LIVE COMMENTARY</b><div>'+comHtml+'</div></div>'; } document.getElementById('fixtureList').innerHTML=h; window.scrollTo(0,0); }

function addStat(){
  const f = d.fixtures.find(function(x){return x.id===liveFixtureId});
  if(!f) return alert("Open a LIVE match first");
  const team = document.getElementById('statTeam').value; // H or A
  const type = document.getElementById('statType').value;
  const suffix = team === 'H' ? 'H' : 'A';
  const other = team === 'H' ? 'A' : 'H';
  if(type === 'poss'){
    f['poss'+suffix] = Math.min(95, (f['poss'+suffix]||50)+1);
    f['poss'+other] = 100 - f['poss'+suffix];
  } else {
    f[type+suffix] = (f[type+suffix]||0) + 1;
    if(type === 'shotsOn') f['shots'+suffix] = (f['shots'+suffix]||0) + 1;
  }
  save(); renderAll();
  alert("Added! Fans see it in 2 sec");
}

}
